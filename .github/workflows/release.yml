name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build-linux-x86_64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build
        run: cargo build --release --target x86_64-unknown-linux-gnu

      - name: Strip binary
        run: strip target/x86_64-unknown-linux-gnu/release/grade-rs

      - name: Package
        run: |
          cd target/x86_64-unknown-linux-gnu/release
          tar czvf ../../../grade-rs-x86_64-unknown-linux-gnu.tar.gz grade-rs

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: grade-rs-x86_64-unknown-linux-gnu
          path: grade-rs-x86_64-unknown-linux-gnu.tar.gz

  build-linux-riscv64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install cross
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Build with cross
        run: cross build --release --target riscv64gc-unknown-linux-gnu

      - name: Package
        run: |
          cd target/riscv64gc-unknown-linux-gnu/release
          tar czvf ../../../grade-rs-riscv64gc-unknown-linux-gnu.tar.gz grade-rs

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: grade-rs-riscv64gc-unknown-linux-gnu
          path: grade-rs-riscv64gc-unknown-linux-gnu.tar.gz

  build-macos-x86_64:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build
        run: cargo build --release --target x86_64-apple-darwin

      - name: Strip binary
        run: strip target/x86_64-apple-darwin/release/grade-rs

      - name: Package
        run: |
          cd target/x86_64-apple-darwin/release
          tar czvf ../../../grade-rs-x86_64-apple-darwin.tar.gz grade-rs

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: grade-rs-x86_64-apple-darwin
          path: grade-rs-x86_64-apple-darwin.tar.gz

  build-macos-aarch64:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build
        run: cargo build --release --target aarch64-apple-darwin

      - name: Strip binary
        run: strip target/aarch64-apple-darwin/release/grade-rs

      - name: Package
        run: |
          cd target/aarch64-apple-darwin/release
          tar czvf ../../../grade-rs-aarch64-apple-darwin.tar.gz grade-rs

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: grade-rs-aarch64-apple-darwin
          path: grade-rs-aarch64-apple-darwin.tar.gz

  build-windows-x86_64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build
        run: cargo build --release --target x86_64-pc-windows-msvc --no-default-features

      - name: Package
        run: Compress-Archive -Path target\x86_64-pc-windows-msvc\release\grade-rs.exe -DestinationPath grade-rs-x86_64-pc-windows-msvc.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: grade-rs-x86_64-pc-windows-msvc
          path: grade-rs-x86_64-pc-windows-msvc.zip

  release:
    needs:
      - build-linux-x86_64
      - build-linux-riscv64
      - build-macos-x86_64
      - build-macos-aarch64
      - build-windows-x86_64
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Display artifacts
        run: ls -R artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/grade-rs-x86_64-unknown-linux-gnu/grade-rs-x86_64-unknown-linux-gnu.tar.gz
            artifacts/grade-rs-riscv64gc-unknown-linux-gnu/grade-rs-riscv64gc-unknown-linux-gnu.tar.gz
            artifacts/grade-rs-x86_64-apple-darwin/grade-rs-x86_64-apple-darwin.tar.gz
            artifacts/grade-rs-aarch64-apple-darwin/grade-rs-aarch64-apple-darwin.tar.gz
            artifacts/grade-rs-x86_64-pc-windows-msvc/grade-rs-x86_64-pc-windows-msvc.zip
          generate_release_notes: true
